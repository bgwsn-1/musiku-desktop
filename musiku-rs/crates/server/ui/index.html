<!DOCTYPE html>
<html lang="id" class="h-full antialiased">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Musiku</title>
<meta name="description" content="Pemutar musik web. Metadata dari YouTube Music, audio asli, lirik sinkron." />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Musiku" />
<meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<link rel="stylesheet" href="/assets/app.css" />
<style>
  /* Variabel font yang di web di-inject `next/font` (Geist / Geist Mono). */
  :root {
    --font-geist-sans: "Geist", "Geist Fallback";
    --font-geist-mono: "Geist Mono", "Geist Mono Fallback";
  }
</style>
<style>
  /* Cegah scroll chaining; bounce elastis ditangani ui-src/elastic-scroll.js. */
  .page-scroll,
  [data-elastic],
  .overflow-y-auto {
    overscroll-behavior: contain;
  }
</style>
</head>
<body class="h-full overflow-hidden bg-window font-sans text-label1">
<div id="root"></div>
<script src="/assets/app.js" defer></script>
</body>
</html>
