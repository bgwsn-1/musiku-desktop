[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/desktop"]

# Binary rilis: opt-level "s" + LTO + strip. Tanpa ini, `.exe` ikut membawa
# seluruh simbol debug dan bisa membengkak ratusan MB.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
authors = ["Musiku"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "json",
  "rustls-tls",
] }
moka = { version = "0.12", features = ["future"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.10"
