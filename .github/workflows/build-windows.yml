name: Build Windows (.exe)

# Membangun installer Windows Musiku.
#
# Kenapa lewat GitHub Actions?
#   Tauri resminya TIDAK mendukung cross-compile Linux→Windows untuk *installer*
#   (NSIS). Runner `windows-latest` di sini adalah cara resmi & paling andal.
#   (Binary .exe mentah tetap bisa di-cross-compile dari Linux lewat
#   `musiku-rs/build-exe.sh`.)
#
# Cara pakai:
#   - Push tag `v*`  → otomatis build & lampirkan .exe ke GitHub Release
#   - Actions → "Run workflow" → build manual, hasil di Artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # ── Toolchain ──────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: musiku-rs

      # ── Aset UI (disematkan ke binary lewat include_bytes!) ────────────
      # build-ui.sh memakai komponen React dari ../src/, jadi dependensi web
      # perlu dipasang dulu.
      - name: Pasang dependensi web
        run: npm ci
        working-directory: .

      - name: Bangun aset UI
        run: ./build-ui.sh
        working-directory: musiku-rs

      # ── Build + bundel installer NSIS ──────────────────────────────────
      - name: Build installer .exe
        run: npx -y @tauri-apps/cli@^2 build --bundles nsis
        working-directory: musiku-rs/crates/desktop

      # ── Simpan hasil ───────────────────────────────────────────────────
      - name: Kumpulkan artefak
        run: |
          mkdir -p dist
          cp musiku-rs/target/release/bundle/nsis/*.exe dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: musiku-windows-installer
          path: dist/*.exe
          if-no-files-found: warn

      - name: Lampirkan ke Release (hanya saat push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
